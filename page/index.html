<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="飞羽科技 HR 智能助理 —— 政策咨询、年假查询、证明开具的 7×24 在线服务" />
  <title>飞羽科技 · HR 智能助理</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- ============ 侧边栏 ============ -->
    <aside class="sidebar" id="sidebar" aria-label="设置面板">
      <div class="sidebar__brand">
        <span class="brand__mark" aria-hidden="true">羽</span>
        <div class="brand__text">
          <h1 class="brand__name">飞羽科技</h1>
          <p class="brand__sub">HR 智能助理</p>
        </div>
      </div>

      <!-- 连接状态 -->
      <button class="health" id="health" type="button" title="点击重新检测服务连接">
        <span class="health__dot" aria-hidden="true"></span>
        <span class="health__text">服务检测中…</span>
      </button>

      <!-- 员工身份 -->
      <div class="panel">
        <label class="label" for="uid">员工 UID</label>
        <input
          class="field"
          id="uid"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="例如 1001"
          value="1001"
          maxlength="16"
        />
        <p class="hint">用于识别你的档案、职级与权限</p>
      </div>

      <!-- 会话 -->
      <div class="panel">
        <div class="panel__head">
          <span class="label">当前会话</span>
          <button class="link" id="newThread" type="button">新建会话</button>
        </div>
        <div class="thread" id="threadId" title="会话 ID（相同 ID 共享记忆）">—</div>
      </div>

      <!-- 快捷提问 -->
      <div class="panel panel--samples">
        <span class="label">你可以这样问</span>
        <ul class="samples" id="samples">
          <li><button class="sample" type="button" data-q="我还有多少天年假？">🏖️ 我还有多少天年假？</button></li>
          <li><button class="sample" type="button" data-q="帮我开一份在职证明">📄 帮我开一份在职证明</button></li>
          <li><button class="sample" type="button" data-q="出差住宿的报销标准是多少？">🧾 出差住宿的报销标准</button></li>
          <li><button class="sample" type="button" data-q="我的基本薪资和职级是什么？">👤 查询我的档案信息</button></li>
        </ul>
      </div>

      <div class="sidebar__foot">
        <p>AI 生成内容仅供参考，最终解释权归 HR 部门所有。</p>
      </div>
    </aside>

    <!-- 移动端遮罩 -->
    <div class="scrim" id="scrim" hidden></div>

    <!-- ============ 主区 ============ -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" type="button" aria-label="打开菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar__title">
          <h2 class="topbar__heading">智能 HR 助理</h2>
          <span class="topbar__meta">政策咨询 · 自助服务 · 7×24 在线</span>
        </div>
        <button class="icon-btn icon-btn--ghost" id="clearBtn" type="button" aria-label="清空对话" title="清空对话">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        </button>
      </header>

      <section class="thread-scroll" id="scroll" aria-live="polite">
        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer">
        <form class="composer__form" id="form" autocomplete="off">
          <textarea
            class="composer__input"
            id="input"
            rows="1"
            placeholder="请输入你的问题，例如：我还有多少天年假？"
            aria-label="输入问题"
          ></textarea>
          <button class="composer__send" id="sendBtn" type="submit" aria-label="发送" title="发送">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </form>
        <p class="composer__hint">Enter 发送 · Shift + Enter 换行</p>
      </footer>
    </main>
  </div>

  <!-- 全局提示 -->
  <div class="toast" id="toast" role="status" aria-live="assertive" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
